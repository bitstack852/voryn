version: "3.8"

# Voryn Infrastructure — Coolify Docker Compose
#
# Services:
#   1. update-server — nginx serving version.json + APK downloads
#   2. bootstrap — WebSocket relay node (port 4001/tcp)

services:
  # ── Update Server ────────────────────────────────────────────────
  # Domain: updates.voryn.bitstack.website
  update-server:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - update-data:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "coolify.managed=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/version.json"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Bootstrap / Relay Node ───────────────────────────────────────
  # WebSocket relay — devices connect to ws://boot1.voryn.bitstack.website:4001/ws
  # Port 4001/tcp exposed directly (bypasses Coolify proxy)
  bootstrap:
    build:
      context: ../..
      dockerfile: deploy/coolify/Dockerfile.bootstrap
    restart: unless-stopped
    ports:
      - "4001:4001/tcp"
    environment:
      - RUST_LOG=info
    labels:
      - "coolify.managed=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  update-data:
    driver: local
